<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目录总览 · Happy LLM Journey</title>
<style>
:root{color-scheme:light dark;--bg:#fafaf8;--ink:#252b2a;--muted:#707874;--line:#e1e5df;--hover:#eef1eb;--panel:#fff;--accent:#477255}
@media(prefers-color-scheme:dark){:root{--bg:#191c1a;--ink:#e5eae5;--muted:#9ca69f;--line:#353c36;--hover:#282f29;--panel:#232923;--accent:#9bc9a6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:940px;margin:28px auto;padding:0 28px}.toolbar{display:flex;gap:18px;margin:24px 0 18px}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}.toolbar button{border:0;background:none;padding:3px 0;color:var(--muted);font-size:13px}.toolbar button:hover{color:var(--ink)}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.module{padding:13px 0;border-top:1px solid var(--line)}.module:last-child{border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;gap:9px;min-height:39px;padding:5px 9px;border-radius:5px;position:relative;list-style:none}.row::-webkit-details-marker{display:none}.row:hover,.row:focus-within{background:var(--hover)}summary.row{cursor:pointer}.chevron{width:15px;flex-shrink:0;color:var(--muted);display:inline-block;transition:transform .12s}details[open]>.row>.chevron{transform:rotate(90deg)}.leaf>.chevron{font-size:10px;text-align:center;color:var(--line)}.label{min-width:0;overflow-wrap:anywhere}.module>.row>.label{font-weight:600;font-size:17px}.children{margin-left:16px;padding-left:16px;border-left:1px solid var(--line)}.info{border:0;background:transparent;color:var(--muted);font-size:13px;width:28px;min-height:28px;margin-left:auto;flex-shrink:0;border-radius:50%}.info:hover{background:var(--line)}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}.module:nth-child(2)>.row>.dot{background:#b2905d}.module:nth-child(3)>.row>.dot{background:#9182ae}.empty{padding:4px 9px 8px 25px;font-size:12px;color:var(--muted)}#tooltip{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 24px #00000012;border-radius:8px;padding:14px 16px;width:340px;max-width:calc(100vw - 24px);font-size:13px;pointer-events:auto}#tooltip[hidden]{display:none}#tip-title{font-weight:600;margin-bottom:5px}#tip-description{margin:0;color:var(--ink)}@media(max-width:600px){main{margin:28px auto;padding:0 16px}.children{margin-left:9px;padding-left:8px}.row{gap:5px;padding-left:3px}.info{min-height:40px;width:32px}.label{font-size:14px}}@media(prefers-reduced-motion:reduce){.chevron{transition:none}}
</style>
</head>
<body>
<main>
<div id="tree" aria-label="知识、最佳实践与活动目录"></div>
<nav class="toolbar" aria-label="目录操作"><button id="expand">全部展开</button><button id="collapse">全部折叠</button></nav>
</main>
<aside id="tooltip" role="tooltip" hidden><div id="tip-title"></div><p id="tip-description"></p></aside>
<script>
const data=/*__TREE_DATA__*/[];
const tree=document.getElementById('tree'),tip=document.getElementById('tooltip');
let active=null,timer=null;
function hide(){tip.hidden=true;active=null;clearTimeout(timer)}
function show(row,node){clearTimeout(timer);active=row;tip.hidden=false;document.getElementById('tip-title').textContent=node.title;document.getElementById('tip-description').textContent=node.description||'暂无说明。';row.setAttribute('aria-describedby','tooltip');const rect=row.getBoundingClientRect();let x=Math.min(rect.left+34,window.innerWidth-tip.offsetWidth-12),y=rect.bottom+6;if(y+tip.offsetHeight>window.innerHeight-12)y=Math.max(12,rect.top-tip.offsetHeight-6);tip.style.left=Math.max(12,x)+'px';tip.style.top=y+'px'}
function scheduleHide(){timer=setTimeout(hide,120)}
function render(node,depth=0){const hasChildren=node.children.length>0, expandable=hasChildren||depth===0;const outer=document.createElement(expandable?'details':'div');if(depth===0){outer.className='module';outer.open=true}const row=document.createElement(expandable?'summary':'div');row.className='row'+(expandable?'':' leaf');const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent=expandable?'›':'·';arrow.setAttribute('aria-hidden','true');row.append(arrow);if(depth===0){const dot=document.createElement('span');dot.className='dot';row.append(dot)}const label=document.createElement(node.url?'a':'span');label.className='label';label.textContent=node.title;if(node.url){label.href=node.url;label.target='_blank';label.rel='noopener noreferrer';label.addEventListener('click',e=>e.stopPropagation())}row.append(label);const info=document.createElement('button');info.type='button';info.className='info';info.textContent='ⓘ';info.setAttribute('aria-label','查看说明：'+node.title);info.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();show(row,node)});row.append(info);row.addEventListener('mouseenter',()=>show(row,node));row.addEventListener('mouseleave',scheduleHide);row.addEventListener('focusin',()=>show(row,node));row.addEventListener('focusout',scheduleHide);outer.append(row);if(expandable){const children=document.createElement('div');children.className='children';node.children.forEach(child=>children.append(render(child,depth+1)));if(!hasChildren){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无已收录条目';children.append(empty)}outer.append(children);outer.addEventListener('toggle',()=>{if(active&&!active.checkVisibility())hide()})}return outer}
data.forEach(node=>tree.append(render(node)));
document.getElementById('expand').onclick=()=>{hide();tree.querySelectorAll('details').forEach(d=>d.open=true)};
document.getElementById('collapse').onclick=()=>{hide();tree.querySelectorAll('details').forEach(d=>d.open=false)};
tip.addEventListener('mouseenter',()=>clearTimeout(timer));tip.addEventListener('mouseleave',scheduleHide);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});document.addEventListener('click',e=>{if(active&&!active.contains(e.target)&&!tip.contains(e.target))hide()});window.addEventListener('resize',hide);window.addEventListener('scroll',hide,{passive:true});
</script>
</body>
</html>
